<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Madhav Manchanda — developer terminal</title>
  <desc id="desc">An animated terminal dashboard showing Madhav Manchanda's profile and current engineering focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset=".48" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset=".48" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EDF5FF"/>
      <stop offset=".6" stop-color="#C7E9FF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="glow" cx=".15" cy=".15" r=".95">
      <stop offset="0" stop-color="#155E75" stop-opacity=".33"/>
      <stop offset=".55" stop-color="#1E1B4B" stop-opacity=".12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-25%" y="-50%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000814" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8DA2C0" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="screen"><rect x="16" y="16" width="1168" height="528" rx="20"/></clipPath>
    <style>
      .mono { font-family:'Fira Code','JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace; }
      .display { font-family:'Orbitron','Space Grotesk','Segoe UI',Arial,sans-serif; font-weight:700; letter-spacing:1.4px; }
      .dim { fill:#71809A; }
      .white { fill:#EDF5FF; }
      .cyan { fill:#67E8F9; }
      .purple { fill:#C4B5FD; }
      .green { fill:#86EFAC; }
      .amber { fill:#FCD34D; }
      /* Animations only touch opacity / dash offsets, never transform,
         so the translate() wrappers below can never be overridden. */
      .l1 { animation: fadeIn .5s .10s ease-out both; }
      .l2 { animation: fadeIn .5s .45s ease-out both; }
      .l3 { animation: fadeIn .5s .80s ease-out both; }
      .l4 { animation: fadeIn .5s 1.15s ease-out both; }
      .l5 { animation: fadeIn .5s 1.45s ease-out both; }
      .l6 { animation: fadeIn .5s 1.75s ease-out both; }
      .l7 { animation: fadeIn .5s 2.05s ease-out both; }
      .l8 { animation: fadeIn .5s 2.40s ease-out both; }
      .monitor { animation: fadeIn 1.1s .3s ease-out both; }
      .terminalTitle { animation: glowText 3.6s ease-in-out infinite; }
      .trace { stroke-dasharray: 520; stroke-dashoffset: 520; animation: drawTrace 2.4s .9s ease-out forwards; }
      .backdrop { animation: drift 14s ease-in-out infinite alternate; }
      @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
      @keyframes glowText { 0%,100% { opacity:1; } 50% { opacity:.8; } }
      @keyframes drawTrace { to { stroke-dashoffset:0; } }
      @keyframes drift { from { opacity:.55; } to { opacity:1; } }
    </style>
  </defs>

  <rect width="1200" height="560" rx="26" fill="#050814"/>
  <rect x="16" y="16" width="1168" height="528" rx="20" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="16" y="16" width="1168" height="528" rx="20" fill="url(#glow)"/>
  <rect class="backdrop" x="16" y="16" width="1168" height="528" rx="20" fill="url(#grid)"/>

  <!-- CRT scan sweep -->
  <g clip-path="url(#screen)">
    <rect x="16" y="-60" width="1168" height="60" fill="#67E8F9" opacity=".035">
      <animate attributeName="y" values="-60;560" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="16" y="16" width="1168" height="528" rx="20" fill="none" stroke="#2A3A55"/>

  <!-- window chrome -->
  <circle cx="53" cy="52" r="7" fill="#FB7185"/><circle cx="78" cy="52" r="7" fill="#FBBF24"/><circle cx="103" cy="52" r="7" fill="#4ADE80"/>
  <text x="600" y="57" text-anchor="middle" class="mono dim" font-size="12" letter-spacing="2.8">MM // DEVELOPER CONSOLE</text>
  <text x="1129" y="57" text-anchor="end" class="mono cyan" font-size="11" letter-spacing="1.4">SESSION: ACTIVE</text>
  <path d="M35 82H1165" stroke="url(#rail)" stroke-opacity=".85" stroke-width="1.5"/>
  <path d="M35 82H1165" stroke="#67E8F9" stroke-width="1.5" stroke-dasharray="85 1045">
    <animate attributeName="stroke-dashoffset" values="0;-1130" dur="4.8s" repeatCount="indefinite"/>
  </path>

  <!-- ================= CONSOLE (left) ================= -->
  <g transform="translate(60 116)">
    <g class="l1">
      <text class="mono cyan" font-size="17">madhav@github</text>
      <text x="157" class="mono dim" font-size="17">:</text>
      <text x="174" class="mono purple" font-size="17">~</text>
      <text x="192" class="mono white" font-size="17">$</text>
      <text x="216" class="mono white" font-size="17">neofetch --profile</text>
      <path d="M0 39H704" stroke="#263853"/>
    </g>

    <g class="l2">
      <text y="91" class="display terminalTitle" font-size="40" fill="url(#nameGrad)">MADHAV MANCHANDA</text>
    </g>
    <g class="l3">
      <text y="122" class="mono dim" font-size="15" letter-spacing="1.05">SOFTWARE ENGINEERING  /  SYSTEMS  /  APPLIED AI</text>
      <text y="165" class="mono green" font-size="15">●</text>
      <text x="22" y="165" class="mono dim" font-size="15">online — building useful software with curiosity and intent</text>
    </g>

    <g class="l4">
      <text y="219" class="mono cyan" font-size="16">madhav@github</text>
      <text x="151" y="219" class="mono dim" font-size="16">:</text>
      <text x="168" y="219" class="mono purple" font-size="16">~</text>
      <text x="186" y="219" class="mono white" font-size="16">$</text>
      <text x="210" y="219" class="mono white" font-size="16">focus --now</text>
    </g>
    <g class="l5"><text y="251" class="mono" font-size="14.5"><tspan class="cyan">▸</tspan><tspan class="dim"> backend systems · data workflows · applied AI</tspan></text></g>
    <g class="l6"><text y="276" class="mono" font-size="14.5"><tspan class="purple">▸</tspan><tspan class="dim"> strong fundamentals, shipped deliberately</tspan></text></g>
    <g class="l7"><text y="301" class="mono" font-size="14.5"><tspan class="green">▸</tspan><tspan class="dim"> status: </tspan><tspan class="amber">building · learning · open to collab</tspan></text></g>

    <g class="l8">
      <text y="355" class="mono cyan" font-size="16">madhav@github</text>
      <text x="151" y="355" class="mono dim" font-size="16">:</text>
      <text x="168" y="355" class="mono purple" font-size="16">~</text>
      <text x="186" y="355" class="mono white" font-size="16">$</text>
      <rect x="210" y="337" width="10" height="21" rx="1" fill="#67E8F9" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0;1" dur=".95s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ================= SYSTEM MONITOR (right) ================= -->
  <g transform="translate(826 116)">
    <g class="monitor">
      <rect width="306" height="335" rx="13" fill="#091121" fill-opacity=".83" stroke="#2A3A55"/>
      <text x="25" y="37" class="mono dim" font-size="11" letter-spacing="2.2">SYSTEM MONITOR</text>
      <circle cx="270" cy="32" r="5" fill="#4ADE80">
        <animate attributeName="opacity" values="1;.32;1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <path d="M25 55H281" stroke="#263853"/>

      <text x="25" y="89" class="mono dim" font-size="11" letter-spacing="1.4">MODE</text>
      <text x="281" y="89" text-anchor="end" class="mono cyan" font-size="12">BUILD / LEARN</text>

      <text x="25" y="127" class="mono dim" font-size="11" letter-spacing="1.4">UPTIME</text>
      <text x="281" y="127" text-anchor="end" class="mono white" font-size="12">CONTINUOUS</text>

      <text x="25" y="174" class="mono dim" font-size="11" letter-spacing="1.4">CURIOSITY</text>
      <rect x="25" y="185" width="256" height="7" rx="3.5" fill="#17243A"/>
      <rect x="25" y="185" width="214" height="7" rx="3.5" fill="url(#meter)">
        <animate attributeName="width" values="175;224;214" dur="3.8s" repeatCount="indefinite"/>
      </rect>

      <text x="25" y="230" class="mono dim" font-size="11" letter-spacing="1.4">CRAFT</text>
      <rect x="25" y="241" width="256" height="7" rx="3.5" fill="#17243A"/>
      <rect x="25" y="241" width="191" height="7" rx="3.5" fill="url(#meter)">
        <animate attributeName="width" values="215;174;191" dur="4.3s" repeatCount="indefinite"/>
      </rect>

      <text x="25" y="286" class="mono dim" font-size="11" letter-spacing="1.4">SHIP FREQUENCY</text>
      <path d="M25 309 L56 296 L82 305 L112 277 L144 293 L179 259 L213 280 L244 243 L281 264V316H25Z" fill="#67E8F9" opacity=".08"/>
      <path d="M25 309 L56 296 L82 305 L112 277 L144 293 L179 259 L213 280 L244 243 L281 264" class="trace" fill="none" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="60" y="509" class="mono dim" font-size="11" letter-spacing="1.7">AVAILABLE FOR COLLABORATION // OPEN SOURCE // GOOD PROBLEMS</text>
  <text x="1132" y="509" text-anchor="end" class="mono dim" font-size="11" letter-spacing="1.7">PROFILE / 01</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
