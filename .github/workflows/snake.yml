name: Refresh Profile Visuals

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/generate_profile_metrics.py"
      - ".github/workflows/snake.yml"

concurrency:
  group: profile-visuals
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: madhav-manchanda
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=cyan&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#36BCF5&color_dots=#0D1117,#1b2b34,#2c4356,#3d5a78,#5684b5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make generated directory writable
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          chmod -R u+rwX dist

      - name: Generate live public profile metrics
        run: python scripts/generate_profile_metrics.py --output dist/profile-metrics.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated visuals
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
